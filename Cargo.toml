[package]
name = "eeprom24x"
version = "0.8.0"
authors = ["Diego Barrios Romero <eldruin@gmail.com>"]
repository = "https://github.com/eldruin/eeprom24x-rs"
license = "MIT OR Apache-2.0"
description = "Platform-agnostic Rust driver for the 24x series serial EEPROMs."
readme = "README.md"
keywords = ["eeprom", "i2c", "driver", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
homepage = "https://github.com/eldruin/eeprom24x-rs"
documentation = "https://docs.rs/eeprom24x"
include = [
    "**/*.rs",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]
edition = "2021"

[features]
default = ["blocking"]
blocking = ["embedded-hal"]
async = ["embedded-hal-async"]
defmt-03 = [
    "dep:defmt",
    "embedded-hal?/defmt-03",
    "embedded-hal-async?/defmt-03",
]

[dependencies]
embedded-hal = { version = "1", optional = true }
embedded-hal-async = { version = "1", optional = true }
embedded-storage = "0.3.1"
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["eh1"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
linux-embedded-hal = "0.4"

[profile.release]
lto = true
